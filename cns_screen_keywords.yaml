# ---------------------------------------------------------------------------
# EXCLUSIONS — strings that create false positives; suppress or de-weight
# ---------------------------------------------------------------------------
exclusions:
  - neural network                      # AI/ML talk, not neuroscience
  - machine learning
  - central lab
  - central fill
  - nervous about                       # analyst filler; blocks a naive "nerv" stem
  - partner of choice                   # boilerplate
  - partnering with payers
  - payer partnership
  - channel partner
  - distribution partner
  - manufacturing partner
  - academic partnership                # usually not licensable BD signal
  - "PD-1"                              # oncology; must not match Parkinson's "PD"
  - "PD-L1"
  - PK/PD                               # pharmacodynamics, not Parkinson's
  - Consumer Health
  - forward-looking statements          # safe-harbor boilerplate block; skip this section entirely

# ---------------------------------------------------------------------------
# KNOWN AMBIGUITIES to resolve in code
# ---------------------------------------------------------------------------
ambiguity_rules:
  - term: "PD"
    rule: count only if a parkinsons/synuclein term appears within the same paragraph AND
          the paragraph does not contain "PK/PD", "PD-1", "PD-L1", or "pharmacodynamic".
  - term: "CNS"
    rule: safe on pharma calls; block if the company reports a "Consumer Nutrition" segment.
  - term: "tau"
    rule: strict \btau\b — otherwise matches "taught", "tautology", ticker fragments.
  - term: "MDS"
    rule: also myelodysplastic syndromes (heme-onc). Require a neuro term in the paragraph.
  - term: "MSA"
    rule: also "master services agreement". Require a neuro term in the paragraph.
  - term: "AES"
    rule: also "adverse events, serious". Require an epilepsy/seizure term in the paragraph.
  - term: "ALS"
    rule: fine as \bALS\b; block "ALSO"/"ALS0" via boundary.

