# CNS / Rare Neuro Earnings-Call Screening Keywords
# Scope: medium (CNS + rare neuro broadly)
# Signals: BD/partnering intent, competitive pipeline moves, TA strategy shifts
# Draft v0.1 — edit freely before any code is written.
#
# MATCHING NOTES (read before implementing):
#   - Case-insensitive. Strip smart quotes/apostrophes first ("Parkinson’s" -> "Parkinson's").
#   - Use word boundaries (\b) on all short/acronym terms or you will match inside other words.
#   - Terms containing "*" below are stems: implement as a prefix match (discontinu* -> discontinued/discontinuing/discontinuation).
#   - Earnings calls have two zones: prepared remarks and Q&A. Analyst Q&A is where BD intent
#     actually leaks. Recommend tagging each hit with its zone; you'll want to filter later.
#   - You chose a flat list. One caveat worth acting on: group B (BD language) is generic
#     corporate vocabulary and will fire on every call. Even in a flat design, consider
#     requiring a group-A (domain) term within the same paragraph before a group-B hit counts.
#     Groups C and D are safe to fire standalone.

